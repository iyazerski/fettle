name: Release

# Every push to main that changes the app publishes a release v0.1.<run>, so
# these links always get the newest:
#   https://github.com/<owner>/<repo>/releases/latest/download/Quill.dmg
#   https://github.com/<owner>/<repo>/releases/latest/download/Quill.zip
# Quill.zip feeds install.sh and the in-app updater; Quill.dmg is for people.
# Each release also points the Homebrew cask in iyazerski/homebrew-tap at it.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "assets/**"
      - "scripts/bundle.sh"
      - "scripts/dmg.py"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  VERSION: 0.1.${{ github.run_number }}

jobs:
  # A release reaches every user through the updater, so it ships only what passes CI.
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    # Apple silicon only, like the Macs it runs on.
    runs-on: macos-15
    permissions:
      contents: write
    env:
      TARGET: aarch64-apple-darwin
      ASSET: Quill.zip
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history and tags, to list the changes since the last release.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Build binary
        env:
          QUILL_VERSION: ${{ env.VERSION }}
        run: cargo build --release --locked --target "$TARGET"
      - name: Test binary
        run: target/$TARGET/release/quill --version
      # A self-signed certificate, the same for every release, so macOS keeps
      # the Accessibility grant when Quill updates.
      - name: Import signing certificate
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 16)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
      - name: Package app
        env:
          QUILL_SIGN_IDENTITY: Quill Code Signing
        run: |
          mkdir dist
          scripts/bundle.sh "target/$TARGET/release/quill" "$VERSION" dist
          ditto -c -k --keepParent dist/Quill.app "dist/$ASSET"
          uvx dmgbuild -s scripts/dmg.py -D app=dist/Quill.app Quill dist/Quill.dmg
          codesign -dr - dist/Quill.app
          rm -rf dist/Quill.app
          cd dist
          shasum -a 256 "$ASSET" > "$ASSET.sha256"
          shasum -a 256 Quill.dmg > Quill.dmg.sha256
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          changes=$(git log --no-merges --format='- %s' ${previous:+"$previous..HEAD"})
          gh release create "v$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "Quill v$VERSION" \
            --notes-file - \
            --latest <<EOF
          ## What's new

          $changes

          ## Install

          - **Download:** get \`Quill.dmg\` below, open it, and drag Quill into Applications. The first time you open Quill, macOS blocks it because it isn't notarized: go to System Settings > Privacy & Security and click **Open Anyway**.
          - **Homebrew:** \`brew install --cask iyazerski/tap/quill\`
          - **Terminal:** \`curl -fsSL https://raw.githubusercontent.com/$GH_REPO/main/install.sh | sh\`
          - **Update:** click **Check for updates** in Quill's settings.
          EOF
      - name: Update Homebrew cask
        env:
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          sha=$(cut -d' ' -f1 "dist/$ASSET.sha256")
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/tap_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          echo "$DEPLOY_KEY" > "$RUNNER_TEMP/tap_key"
          chmod 600 "$RUNNER_TEMP/tap_key"
          git clone --depth 1 git@github.com:iyazerski/homebrew-tap.git "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          sed -i '' -E "s/^  version \".*\"/  version \"$VERSION\"/; s/^  sha256 \".*\"/  sha256 \"$sha\"/" Casks/quill.rb
          git diff --stat
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -am "Update Quill to $VERSION"
          git push
