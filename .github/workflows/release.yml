name: Release

# Every push to main that changes the app publishes a release v0.1.<run>, so
# this link always gets the newest:
#   https://github.com/<owner>/<repo>/releases/latest/download/Quill.zip
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "assets/**"
      - "scripts/bundle.sh"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  VERSION: 0.1.${{ github.run_number }}

jobs:
  release:
    # Apple silicon only, like the Macs it runs on.
    runs-on: macos-15
    permissions:
      contents: write
    env:
      TARGET: aarch64-apple-darwin
      ASSET: Quill.zip
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}
      - name: Build binary
        env:
          QUILL_VERSION: ${{ env.VERSION }}
        run: cargo build --release --locked --target "$TARGET"
      - name: Test binary
        run: target/$TARGET/release/quill --version
      # A self-signed certificate, the same for every release, so macOS keeps
      # the Accessibility grant when Quill updates.
      - name: Import signing certificate
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 16)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
      - name: Package app
        env:
          QUILL_SIGN_IDENTITY: Quill Code Signing
        run: |
          mkdir dist
          scripts/bundle.sh "target/$TARGET/release/quill" "$VERSION" dist
          ditto -c -k --keepParent dist/Quill.app "dist/$ASSET"
          codesign -dr - dist/Quill.app
          rm -rf dist/Quill.app
          cd dist
          shasum -a 256 "$ASSET" > "$ASSET.sha256"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "v$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "Quill v$VERSION" \
            --notes "Build from ${GITHUB_SHA::7}. Install or update: \`curl -fsSL https://raw.githubusercontent.com/$GH_REPO/main/install.sh | sh\`" \
            --latest
