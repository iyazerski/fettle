name: CI

# Not on push: every push to main that changes the app runs these checks
# through the release.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  rust:
    # The app is macOS only (AppKit), and its Swift bridge needs the macOS 26
    # SDK, which has Apple's on-device model.
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --all --check
      # Compiled dependencies, saved by runs on main and reused until Cargo.lock changes.
      - uses: Swatinem/rust-cache@v2.9.3
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked

  # Its own job, as it compiles nothing and would otherwise wait for the tests.
  licenses:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2.90.2
        with:
          tool: cargo-about
      - name: Third-party licenses are current
        run: |
          make licenses
          git diff --exit-code THIRD_PARTY_LICENSES.md || {
            echo "::error::THIRD_PARTY_LICENSES.md is stale: run make licenses and commit it"
            exit 1
          }
