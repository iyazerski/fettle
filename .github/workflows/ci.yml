name: CI

on:
  pull_request:
  workflow_dispatch:

# Only PR runs share a group, so a new push cancels the outdated run and frees its macOS runner.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# Debug info makes up most of the cached target directory, and CI never reads it.
env:
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format
        run: cargo fmt --all --check
      - uses: taiki-e/install-action@v2.90.6
        with:
          tool: cargo-about
      - name: Third-party licenses are current
        run: |
          make licenses
          git diff --exit-code THIRD_PARTY_LICENSES.md || {
            echo "::error::THIRD_PARTY_LICENSES.md is stale: run make licenses and commit it"
            exit 1
          }

  macos:
    # Foundation Models needs the macOS 26 SDK, which Xcode 26 provides on macos-15.
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2.9.3
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
