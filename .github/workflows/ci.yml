name: CI

on:
  push:
    branches:
      - main
  pull_request:
  # The release runs these checks first.
  workflow_call:

jobs:
  rust:
    # The app is macOS only (AppKit).
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
      - uses: taiki-e/install-action@v2.90.2
        with:
          tool: cargo-about
      - name: Third-party licenses are current
        run: |
          make licenses
          git diff --exit-code THIRD_PARTY_LICENSES.md || {
            echo "::error::THIRD_PARTY_LICENSES.md is stale: run make licenses and commit it"
            exit 1
          }
